<!doctype html><html lang="en"><meta charset="utf-8"><title>Local export verification</title><button id="run">Run synthetic browser export</button><pre id="status">Ready</pre><video id="video" controls></video><script type="module">
import {BrowserEngine} from '/browser-engine.mjs';
const status=document.getElementById('status');
document.getElementById('run').onclick=async()=>{try{
 const engine=new BrowserEngine(p=>status.textContent=JSON.stringify(p),new AbortController().signal);await engine.start();
 await engine.exec(['-f','lavfi','-i','color=c=blue:s=640x360:r=24:d=6','-f','lavfi','-i','sine=frequency=440:sample_rate=48000:duration=6','-c:v','libx264','-pix_fmt','yuv420p','-c:a','aac','-ac','2','-shortest','source-test.mp4']);
 const bytes=await engine.ff.readFile('source-test.mp4'),source=new Blob([bytes],{type:'video/mp4'});
 const plan={duration:6,cuts:[{time:4}],sources:['E','X'].map(code=>({code,blob:source,offset:0,duration:6}))};
 const blob=await engine.render(plan,360,true,c=>c==='E'?'English':'German',{duration:1,position:'custom',x:800,y:400,design:{background:'#00ff00',opacity:1}});
 const video=document.getElementById('video');video.src=URL.createObjectURL(blob);await new Promise(r=>video.onloadeddata=r);
 const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;const ctx=canvas.getContext('2d');
 async function frame(t){video.currentTime=t;await new Promise(r=>video.onseeked=r);ctx.drawImage(video,0,0,640,360);return ctx.getImageData(0,0,640,360).data}
 const early=await frame(.5),hidden=await frame(2),before=await frame(2.9),end1=await frame(3.5),end2=await frame(4.5);
 const green=b=>b[(205*640+402)*4+1];const gray=b=>{let count=0;for(let y=330;y<355;y++)for(let x=50;x<590;x++){const i=(y*640+x)*4;if(b[i]>100&&Math.abs(b[i]-b[i+1])<30&&Math.abs(b[i]-b[i+2])<30)count++}return count};
 const checks={bannerVisible:green(early)>150,bannerHides:green(hidden)<50,bannerRestarts:green(end2)>150,noEarlyCredit:gray(before)<10,creditBeforeCut:gray(end1)>50,creditAfterCut:gray(end2)>50};status.textContent=JSON.stringify({passed:Object.values(checks).every(Boolean),checks,bytes:blob.size},null,2);
 }catch(e){status.textContent='FAILED '+e.stack}};
</script></html>
